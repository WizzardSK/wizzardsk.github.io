name: Gamelists updater

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  # Run by hand after a change in WizzardSK/gameflix to deploy it
  workflow_dispatch:
    inputs:
      main_only:
        description: 'Only the front page (main.html, menu): no platform pages, no fantasy consoles'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run script
        # the token lifts generate.sh's GitHub API calls (the MAME snap
        # list) out of the anonymous limit the runners share
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_ONLY: ${{ inputs.main_only }}
        run: bash update.sh
